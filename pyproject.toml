[project]
name = "promptcoach-plugin"
version = "0.1.0"
description = "Claude Code plugin for the LernerPython prompt coach (hook code is stdlib only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
addopts = "--cov=promptcoach_client --cov=coach_hook --cov-branch --cov-report=term-missing --cov-fail-under=100 -p no:cacheprovider"
pythonpath = ["plugins/promptcoach/hooks", "tests"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
files = ["plugins/promptcoach/hooks", "tests"]
mypy_path = ["plugins/promptcoach/hooks", "tests"]
explicit_package_bases = true
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S108"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["promptcoach_client", "coach_hook", "conftest", "server_contract"]
