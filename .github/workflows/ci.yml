name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every OS Claude Code runs on (Windows: see docs/windows.md), each with
        # the oldest Python the hook supports and the newest.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run mypy --python-version 3.10 tests
      # Coverage is gated on the union of every cell (the coverage job below),
      # not per cell: Windows can't run the POSIX branches and macOS and Linux
      # can't run the Windows ones, so each cell covers only its own share.
      # A cell still fails on any failed test.
      # -v names each test before it runs; a test stuck past the conftest's
      # hard limit (150 s) dumps every thread's stack to the hang log and
      # ends the run, which the next step prints.
      - run: uv run pytest -v --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python }}
          PROMPTCOACH_HANG_LOG: ${{ runner.temp }}/pytest-hang.log
      - name: The last test that ran, and every thread's stack if one hung
        if: ${{ failure() }}
        shell: bash
        run: tail -n 200 "$RUNNER_TEMP/pytest-hang.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.${{ matrix.os }}-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    # Every cell's data combined, held to 100%: each platform's branches must
    # be covered by tests that ran on that platform. Runs even when a cell
    # failed, and then fails too.
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - run: uv run coverage combine coverage-data
      - run: uv run coverage report --fail-under=100
      - name: Every cell passed
        if: ${{ always() && needs.check.result != 'success' }}
        run: |
          echo "a matrix cell failed: ${{ needs.check.result }}"
          exit 1
