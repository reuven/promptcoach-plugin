name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every OS Claude Code runs on (Windows: see docs/windows.md), each with
        # the oldest Python the hook supports and the newest.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run mypy --python-version 3.10 tests
      # Coverage is gated on the union of every cell (the coverage job below),
      # not per cell: Windows can't run the POSIX branches and macOS and Linux
      # can't run the Windows ones, so each cell covers only its own share.
      # A cell still fails on any failed test.
      # -v names each test before it runs. The conftest's watchdog dumps
      # every thread's stack to the hang log after 150 s with no progress.
      # tools/ci_run.py SIGKILLs pytest's whole process group (taskkill /T
      # on Windows) at its deadline, which nothing in the run can ignore, and
      # keeps the output in a file. The step's limit is a last resort above it.
      # What this cell collects, before running anything: a difference
      # between the 3.9 and 3.14 cells shows here.
      - name: Collect
        timeout-minutes: 3
        run: uv run python tools/ci_run.py --output "${{ runner.temp }}/pytest-collect.log" --deadline 120 -- uv run pytest --collect-only -q --no-cov
      # A soft process limit (POSIX; Git Bash on Windows has none), and the
      # runner also stops the run if its group passes 500 processes.
      - name: Tests
        shell: bash
        run: |
          ulimit -S -u 3000 2>/dev/null || echo "no process limit set here"
          uv run python tools/ci_run.py --output "${{ runner.temp }}/pytest-output.log" --deadline 480 -- uv run pytest -v --cov-fail-under=0
        timeout-minutes: 10
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python }}
          PROMPTCOACH_HANG_LOG: ${{ runner.temp }}/pytest-hang.log
      - name: The end of the run's output, and the hang log
        if: ${{ always() }}
        shell: bash
        run: |
          tail -n 300 "$RUNNER_TEMP/pytest-output.log" || true
          echo "--- hang log ---"
          tail -n 200 "$RUNNER_TEMP/pytest-hang.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: pytest-logs-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/pytest-output.log
            ${{ runner.temp }}/pytest-hang.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.${{ matrix.os }}-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    # Every cell's data combined, held to 100%: each platform's branches must
    # be covered by tests that ran on that platform. Runs even when a cell
    # failed, and then fails too.
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - run: uv run coverage combine coverage-data
      - run: uv run coverage report --fail-under=100
      - name: Every cell passed
        if: ${{ always() && needs.check.result != 'success' }}
        run: |
          echo "a matrix cell failed: ${{ needs.check.result }}"
          exit 1
