# A throwaway, to find where pytest's collection hangs on Python 3.9 in CI.
# It runs only on pushes to diag/** branches, never on main, tags or pull
# requests, and no step can fail it: each step is capped, and the command in
# it is SIGABRTed after 90 s (with PYTHONFAULTHANDLER=1, so a hung Python
# prints its stack) and SIGKILLed 10 s later. Delete before merging.
name: diag

on:
  push:
    branches: [diag/**]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9"]
        include:
          # The control: a cell that passes in ci.yml.
          - os: ubuntu-latest
            python: "3.14"
    defaults:
      run:
        shell: bash
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        continue-on-error: true
        timeout-minutes: 3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      # `hold CMD...` runs CMD with the outer kill and prints the clock and
      # the status on each side. GNU timeout where there is one (Linux, Git
      # Bash), else perl; both signal the command's whole process group, so
      # the Python under `uv run` gets the SIGABRT too.
      - name: Write the outer kill
        continue-on-error: true
        timeout-minutes: 3
        run: |
          cat > "$RUNNER_TEMP/hold.sh" <<'EOF'
          export PROMPTCOACH_HANG_LOG="$RUNNER_TEMP/pytest-hang.log"
          export PROMPTCOACH_TEST_HARD_LIMIT_S=60
          hold() {
            echo "hold: start $(date -u +%H:%M:%S)"
            if timeout --version >/dev/null 2>&1; then
              timeout -s ABRT -k 10 90 "$@"
            else
              perl -e '
                my $p = fork; die "fork: $!" unless defined $p;
                if ($p == 0) { setpgrp(0, 0); exec @ARGV; die "exec: $!" }
                $SIG{ALRM} = sub {
                  print STDERR "hold: 90 s, SIGABRT to the group\n";
                  kill "ABRT", -$p; sleep 10; kill "KILL", -$p;
                };
                alarm 90; waitpid($p, 0); my $s = $?;
                exit($s & 127 ? 128 + ($s & 127) : $s >> 8);
              ' "$@"
            fi
            local status=$?
            echo "hold: end $(date -u +%H:%M:%S) status=$status"
            return $status
          }
          EOF
          source "$RUNNER_TEMP/hold.sh"
          type hold
          timeout --version 2>&1 | head -1 || echo "no GNU timeout: perl"
      - name: Sync
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source "$RUNNER_TEMP/hold.sh"
          hold uv sync --locked
      - name: a. The Python
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source "$RUNNER_TEMP/hold.sh"
          hold uv run python -c "import sys; print(sys.version)"
      - name: b. Import pytest, hypothesis, coverage
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source "$RUNNER_TEMP/hold.sh"
          hold uv run python -c "import pytest, hypothesis, coverage; print(pytest.__version__, hypothesis.__version__, coverage.__version__)"
      - name: c. Import the conftest, with import times
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source "$RUNNER_TEMP/hold.sh"
          hold uv run python -X importtime -c "import sys; sys.path[:0]=['tests','plugins/promptcoach/hooks']; import conftest" 2>&1 | tail -40
      - name: d. Collect
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source "$RUNNER_TEMP/hold.sh"
          hold uv run pytest --collect-only -q --no-cov -p no:cacheprovider
      - name: e. Collect without the conftest
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source "$RUNNER_TEMP/hold.sh"
          hold uv run pytest --collect-only -q --no-cov -p no:cacheprovider --noconftest
      - name: f. Collect without pytest's faulthandler plugin
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source "$RUNNER_TEMP/hold.sh"
          hold uv run pytest --collect-only -q --no-cov -p no:cacheprovider -p no:faulthandler
      - name: g. ci_run alone, on a 60 s sleep with a 15 s deadline
        continue-on-error: true
        timeout-minutes: 3
        run: |
          source "$RUNNER_TEMP/hold.sh"
          date -u +%H:%M:%S
          hold uv run python tools/ci_run.py --output "$RUNNER_TEMP/ci-run.log" --deadline 15 -- python -c "import time; time.sleep(60)"
          date -u +%H:%M:%S
      - name: Processes still running
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ "$RUNNER_OS" = Windows ]; then tasklist; else ps -ef; fi
      - name: Print the logs
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for f in "$RUNNER_TEMP/pytest-hang.log" "$RUNNER_TEMP/ci-run.log"; do
            echo "=== $f"; cat "$f" 2>/dev/null || echo "(none)"
          done
      - name: Upload the logs
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-logs-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/pytest-hang.log
            ${{ runner.temp }}/ci-run.log
          if-no-files-found: warn
